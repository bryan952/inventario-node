<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inventario Productos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Inventario Productos Electrónicos - Diseño Mejorado</h2>
<p>Sistema de Inventario desarrollado con Node.js y MySQL</p>

<form id="formulario">

<input type="text" id="nombre" placeholder="Nombre" class="form-control mb-2" required>

<input type="text" id="descripcion" placeholder="Descripción" class="form-control mb-2" required>

<input type="number" id="precio" placeholder="Precio" class="form-control mb-2" required>

<input type="number" id="stock" placeholder="Stock" class="form-control mb-2" required>

<button class="btn btn-primary">Guardar</button>

</form>

<hr>

<table class="table">

<thead>

<tr>
<th>ID</th>
<th>Nombre</th>
<th>Descripción</th>
<th>Precio</th>
<th>Stock</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tabla">

</tbody>

</table>


<script>

const formulario = document.getElementById("formulario");
const tabla = document.getElementById("tabla");


formulario.addEventListener("submit", async(e)=>{

e.preventDefault();

const producto = {

nombre: document.getElementById("nombre").value,
descripcion: document.getElementById("descripcion").value,
precio: document.getElementById("precio").value,
stock: document.getElementById("stock").value

};

function editar(id,nombre,descripcion,precio,stock){

document.getElementById("nombre").value = nombre;
document.getElementById("descripcion").value = descripcion;
document.getElementById("precio").value = precio;
document.getElementById("stock").value = stock;

formulario.onsubmit = async(e)=>{

e.preventDefault();

const producto = {
nombre,
descripcion,
precio,
stock
};

await fetch("/api/productos/"+id,{
method:"PUT",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
nombre: document.getElementById("nombre").value,
descripcion: document.getElementById("descripcion").value,
precio: document.getElementById("precio").value,
stock: document.getElementById("stock").value
})
});

cargar();

};

}

await fetch("/api/productos",{

method:"POST",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(producto)

});

cargar();

});


async function cargar(){
    async function eliminar(id){

await fetch("/api/productos/"+id,{
method:"DELETE"
});

cargar();

}

const respuesta = await fetch("/api/productos");

const datos = await respuesta.json();

tabla.innerHTML="";

datos.forEach(p=>{

tabla.innerHTML += `



<tr>
<td>${p.id}</td>
<td>${p.nombre}</td>
<td>${p.descripcion}</td>
<td>${p.precio}</td>
<td>${p.stock}</td>
<td>
<button onclick="eliminar(${p.id})" class="btn btn-danger btn-sm">Eliminar</button>
<button onclick="editar(${p.id},'${p.nombre}','${p.descripcion}',${p.precio},${p.stock})" class="btn btn-warning btn-sm">Editar</button>
</td>
</tr>

`;

});

}

cargar();

</script>

</body>

</html>
